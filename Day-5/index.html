<!DOCTYPE html>
<html>

<head>
    <title>Promise Example</title>
</head>

<body>

    <h1>Promise Demo</h1>

    <script>
        const myPromise = new Promise((resolve, reject) => {
            resolve("Promise Resolved Successfully");
        });

        myPromise.then(result => {
            console.log(result);
        });
    </script>

</body>

</html>
